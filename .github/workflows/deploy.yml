name: Build and Deploy Eleventy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # - name: Install dependencies
      #   run: npm install

      # - name: Build site
      #   run: npx eleventy

      - name: Install deps
        run: npm ci

      - name: Build (Eleventy + Tailwind)
        run: npm run build

      # --- Build Tailwind CSS BEFORE Eleventy ---
      # Adjust -i / -o paths if yours differ.
      # - name: Build CSS (Tailwind)
      #   run: npx tailwindcss -i ./tailwind.css -o ./assets/tailwind.css --minify

      # - name: Build site (Eleventy)
      #   run: npx eleventy

      - name: Add .nojekyll
        run: touch _site/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages 

